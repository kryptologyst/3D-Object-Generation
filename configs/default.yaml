# Default configuration for 3D object generation

# Model configuration
model:
  type: "vae"  # Options: vae, gan, diffusion, generator
  z_dim: 128
  num_points: 1024
  hidden_dim: 512
  learning_rate: 1e-4
  weight_decay: 1e-5
  
  # VAE specific
  beta: 1.0
  
  # GAN specific
  beta1: 0.5
  beta2: 0.999
  
  # Diffusion specific
  num_timesteps: 1000

# Data configuration
data:
  batch_size: 32
  num_workers: 4
  num_points: 1024
  synthetic: true
  shape_types: ["sphere", "cube", "cylinder"]
  normalize: true
  augment: true

# Training configuration
training:
  max_epochs: 100
  patience: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: 32
  accelerator: "auto"
  devices: 1

# Paths
paths:
  data_dir: "data"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  output_dir: "outputs"

# Experiment
experiment:
  name: "3d_generation"
  seed: 42
  debug: false

# Logging
logging:
  level: "INFO"
  use_wandb: false
  wandb_project: "3d-object-generation"
